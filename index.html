:root{
  --felt:#10382e; --felt-2:#0b2a22; --paper:#f6f1e4; --ink:#1b1a17; --red:#b3261e;
  --brass:#e2b44c; --ui:#0a1f1a; --ui-line:#1e4a3c; --ui-text:#e8efe9; --ui-dim:#9fb8ad;
  --display:'AtkinsonHL','Verdana',sans-serif;
  --body:'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cw:84px; --ch:116px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ui);color:var(--ui-text);font-family:var(--body);font-size:14px;display:flex;flex-direction:column;overflow:hidden}

#bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;background:var(--ui);border-bottom:1px solid var(--ui-line)}
#bar h1{font-family:var(--display);font-size:16px;font-weight:700;margin:0 8px 0 0;letter-spacing:.02em;color:var(--brass)}
.grp{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;background:#12342b;border:1px solid var(--ui-line);color:var(--ui-text);border-radius:8px;padding:0 12px;min-height:38px;cursor:pointer;display:inline-flex;align-items:center}
button:hover{background:#18463a}
button[aria-pressed="true"]{background:var(--brass);color:#2a1e00;border-color:var(--brass);font-weight:600}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
kbd{font:inherit;font-size:11px;line-height:1;margin-left:8px;padding:3px 6px;border:1px solid var(--ui-line);border-bottom-width:2px;border-radius:5px;color:var(--ui-dim);background:#0b241d;white-space:nowrap}
button[aria-pressed="true"] kbd{background:rgba(0,0,0,.15);border-color:rgba(0,0,0,.3);color:#2a1e00}
#status{flex:1 1 260px;color:var(--ui-dim);font-size:13px;min-width:0;text-align:right}

#scroll{flex:1;min-height:0;overflow:auto;background:var(--felt-2)}
#scroll{scrollbar-width:none;-ms-overflow-style:none}
#scroll::-webkit-scrollbar{display:none}
#sizer{position:relative}
#table{position:absolute;left:0;top:0;transform-origin:0 0;
  background:
    radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.07),transparent 60%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 4px),
    var(--felt);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.slot{position:absolute;width:var(--cw);height:var(--ch);border:2px dashed rgba(255,255,255,.18);border-radius:8px;transition:border-color .15s,background .15s}
.slot.over{border-color:var(--brass);background:rgba(226,180,76,.1)}
.deckLbl{position:absolute;width:var(--cw);text-align:center;color:var(--ui-dim);font-size:12px;font-variant-numeric:tabular-nums}

.card{position:absolute;width:var(--cw);height:var(--ch);perspective:700px;touch-action:none;cursor:grab;
  transition:transform .22s ease;user-select:none;-webkit-user-select:none;border-radius:8px}
.card.dragging{cursor:grabbing;transition:none}
.card.sel{outline:2px solid var(--brass);outline-offset:3px}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .3s ease}
.card.down .flip{transform:rotateY(180deg)}
.card.dragging .flip{transition:none}
.face{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  border:1px solid rgba(0,0,0,.45);box-shadow:0 2px 5px rgba(0,0,0,.4)}
.front{background:var(--paper);color:var(--ink)}
.front.red{color:var(--red)}
.cn{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1;font-size:15px}
.cn b{font-weight:600}
.cn i{font-style:normal;font-size:15px}
.cn.tl{left:6px;top:6px}
.cn.br{right:6px;bottom:6px;transform:rotate(180deg)}
.big{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:14px;font-family:var(--display);font-weight:700;font-size:50px;line-height:1}
.big::after{content:'';position:absolute;left:50%;bottom:20px;width:46px;height:4px;margin-left:-23px;border-radius:2px;background:currentColor}
.back{transform:rotateY(180deg);background:#1a2b57}
.back svg{display:block;width:100%;height:100%}
.deckback{background:repeating-linear-gradient(45deg,#1b2a27 0 6px,#22352f 6px 12px);box-shadow:inset 0 0 0 4px #14201d,inset 0 0 0 5px var(--brass),0 1px 2px rgba(0,0,0,.5)}

.dealing .card{transition:left .7s cubic-bezier(.22,.8,.3,1),top .7s cubic-bezier(.22,.8,.3,1),transform .22s ease}
#table{cursor:grab}
#table.panning,#table.panning .card{cursor:grabbing}

@media (prefers-reduced-motion:reduce){.card,.flip{transition:none}}
@media (max-width:640px){#status{text-align:left;flex-basis:100%}#bar h1{width:100%}}
</style>

  }

  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function shuffle(a,rnd){for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

  var table=document.getElementById('table');
  var sizer=document.getElementById('sizer');
  var statusEl=document.getElementById('status');
  var slotEl=null,cards=[],els=[],DES=[],selected=null,zTop=1,snapOn=true,allDown=false,deckLbl=null;
  var scale=window.innerWidth<900?.55:.85,dealing=false,lastId=null;

  var mctx=document.createElement('canvas').getContext('2d');
  function ink(ch){
    mctx.font='700 200px "'+FONT+'",Verdana,sans-serif';
    var m=mctx.measureText(ch);
    var l=m.actualBoundingBoxLeft,r=m.actualBoundingBoxRight,a=m.actualBoundingBoxAscent,d=m.actualBoundingBoxDescent;
    if(!(r+l>0)){return{l:60,r:60,a:140,d:0}}
    return{l:l,r:r,a:a,d:d};
  }
  function inUnion(D,x,y){
    return D.cells.some(function(k){
      var w=k.o?116:84,h=k.o?84:116;
      return x>=k.cx-w/2&&x<=k.cx+w/2&&y>=k.cy-h/2&&y<=k.cy+h/2;
    });
  }
  function cover(D,b){
    var n=0,t=0,x,y;
    for(x=b.x0+2;x<b.x1;x+=4)for(y=b.y0+2;y<b.y1;y+=4){t++;if(inUnion(D,x,y))n++}
    return t?n/t:1;
  }

  function makeDesigns(){
    DES=[];
    for(var r=0;r<13;r++){
      var rnd=rng(1000+r*77);
      var sh=SHAPES[LEVELS.shape[r]],mir=LEVELS.mirror[r];
      var cells=sh.cells.map(function(c){return{cx:mir?sh.W-c[0]:c[0],cy:c[1],o:c[2]}});
      cells.sort(function(a,b){return a.cy-b.cy});
      var rows=[],cur=null;
      cells.forEach(function(c){if(cur&&c.cy-cur.y0<=20)cur.list.push(c);else{cur={y0:c.cy,list:[c]};rows.push(cur)}});
      cells=[];
      rows.forEach(function(rw){rw.list.sort(function(a,b){return a.cx-b.cx});cells=cells.concat(rw.list)});
      var perm=shuffle([0,1,2,3],rnd);
      var qs=shuffle([0,1,2,3],rnd),tw={};
      for(var i=0;i<LEVELS.twist[r];i++)tw[qs[i]]=true;
      cells.forEach(function(c,k){c.rot=((c.o?90:0)+(LEVELS.flip[r]?180:0)+(tw[k]?180:0))%360});

      var dec='',alpha=Math.min(.85,.5+r*.03);
      for(var k=0;k<LEVELS.decoys[r];k++){
        var x1=rnd()*sh.W,y1=rnd()*sh.H,a=rnd()*Math.PI*2,len=50+rnd()*110;
        var x2=x1+Math.cos(a)*len,y2=y1+Math.sin(a)*len,w=4+rnd()*(4+r*.6);
        var path=rnd()<.5?'M'+x1.toFixed(1)+' '+y1.toFixed(1)+' L'+x2.toFixed(1)+' '+y2.toFixed(1):
          'M'+x1.toFixed(1)+' '+y1.toFixed(1)+' Q'+(x1+(rnd()-.5)*120).toFixed(1)+' '+(y1+(rnd()-.5)*120).toFixed(1)+' '+x2.toFixed(1)+' '+y2.toFixed(1);
        dec+='<path d="'+path+'" fill="none" stroke="%D%" stroke-opacity="'+alpha.toFixed(2)+'" stroke-width="'+w.toFixed(1)+'" stroke-linecap="round"/>';
      }
      DES.push({W:sh.W,H:sh.H,cap:sh.cap,gx:mir?sh.W-sh.gx:sh.gx,gy:sh.gy,cells:cells,perm:perm,tw:tw,dec:dec,glyph:null});
    }
  }

  function glyphOf(r){
    var D=DES[r];
    if(D.glyph)return D.glyph;
    var ch=CODES[r][4],m=ink(ch),cap=ink('H').a,xh=ink('x').a;
    var s0=D.cap/cap,s=s0,n=0,b;
    function box(s){
      var ox=D.gx-((m.r-m.l)/2)*s,oy=D.gy+cap*s/2;
      return{ox:ox,oy:oy,x0:ox-m.l*s,x1:ox+m.r*s,y0:oy-m.a*s,y1:oy+m.d*s};
    }
    b=box(s);
    while(cover(D,b)<.93&&s>s0*.55&&n<60){s*=.97;n++;b=box(s)}
    var g=LEVELS.guide[r],oy=b.oy;
    var lines='<g stroke="%F%" stroke-opacity="'+g+'" fill="none">'+
      '<line x1="0" x2="'+D.W+'" y1="'+oy.toFixed(1)+'" y2="'+oy.toFixed(1)+'" stroke-width="2.5"/>'+
      '<line x1="0" x2="'+D.W+'" y1="'+(oy-xh*s).toFixed(1)+'" y2="'+(oy-xh*s).toFixed(1)+'" stroke-width="1.5" stroke-dasharray="7 5"/>'+
      '<line x1="0" x2="'+D.W+'" y1="'+(oy-cap*s).toFixed(1)+'" y2="'+(oy-cap*s).toFixed(1)+'" stroke-width="1.5" stroke-dasharray="2 5"/></g>';
    D.glyph=lines+'<g transform="translate('+b.ox.toFixed(2)+' '+b.oy.toFixed(2)+') scale('+s.toFixed(4)+')">'+
      '<text x="0" y="0" font-family="'+FONT+',Verdana,sans-serif" font-weight="700" font-size="200" fill="%F%" stroke="%O%" stroke-width="'+(4/s).toFixed(2)+'" stroke-linejoin="round" paint-order="stroke">'+ch+'</text></g>';
    return D.glyph;
  }

  function backSvg(c){
    var D=DES[c.r],i=c.id,q=c.q,r=c.r,P=PAL[palIdx(c.id)],cell=D.cells[q];
    var sr=rng(9000+i*31),ang=Math.round(sr()*180),ph=Math.round(sr()*14);
    var out='<svg viewBox="0 0 '+CW+' '+CH+'" aria-hidden="true"><defs>'+
      '<pattern id="st'+i+'" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="16" height="16" fill="'+P[0]+'"/><rect width="6" height="16" fill="'+P[1]+'" opacity="'+LEVELS.stripe[r]+'"/></pattern>'+
      '<linearGradient id="gr'+i+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="'+LEVELS.grad[r]+'"/><stop offset="1" stop-color="#000" stop-opacity="'+LEVELS.grad[r]+'"/></linearGradient>'+
      '<pattern id="ms'+i+'" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate('+ang+') translate('+ph+' 0)"><rect width="5" height="14" fill="'+P[1]+'" opacity="'+LEVELS.mislead[r]+'"/></pattern>'+
      '</defs>'+
      '<g transform="translate('+(CW/2)+' '+(CH/2)+') rotate('+(-cell.rot)+') translate('+(-cell.cx)+' '+(-cell.cy)+')">'+
      '<rect width="'+D.W+'" height="'+D.H+'" fill="url(#st'+i+')"/>'+
      '<rect width="'+D.W+'" height="'+D.H+'" fill="url(#gr'+i+')"/>'+
      (D.dec+glyphOf(r)).replace(/%F%/g,P[2]).replace(/%O%/g,P[3]).replace(/%D%/g,P[4])+'</g>';
    if(LEVELS.mislead[r]>0)out+='<rect width="'+CW+'" height="'+CH+'" fill="url(#ms'+i+')"/>';
    return out+'</svg>';
  }

  function deckLayout(){
    var order=shuffle(Array.apply(null,{length:52}).map(function(_,i){return i}),Math.random);
    cards=[];zTop=100;
    for(var id=0;id<52;id++){
      var r=Math.floor(id/4),s=id%4,pos=order.indexOf(id);
      cards.push({id:id,r:r,s:s,q:DES[r].perm.indexOf(s),x:DX+(51-pos)*.12,y:DY+(51-pos)*.12,rot:0,up:false,z:pos+1,inDeck:true});
    }
  }
  function topDeck(){var t=null;cards.forEach(function(c){if(c.inDeck&&(!t||c.z>t.z))t=c});return t}
  function deckCount(){return cards.filter(function(c){return c.inDeck}).length}
  function updateDeck(){if(deckLbl)deckLbl.textContent='Deck · '+deckCount()}

  function leaveDeck(c){
    c.inDeck=false;
    fill(c);
    c.rot=0;
    clamp(c);
    updateDeck();
  }
  function dealSpots(n){
    var cx=760,cy=400,out=[],tries,x,y,p;
    function ok(x,y){return cards.every(function(o){return o.inDeck||Math.abs(o.x-x)>=60||Math.abs(o.y-y)>=84})}
    function gauss(){return(Math.random()+Math.random()+Math.random()-1.5)/1.5}
    for(var i=0;i<n;i++){
      tries=0;
      do{
        var wide=Math.random()<.12?1.6:1;
        x=cx+gauss()*540*wide-CW/2;y=cy+gauss()*390*wide-CH/2;
        tries++;
      }while(tries<25&&(x<200||y<20||x>TW-CW||y>TH-CH||!ok(x,y)));
      out.push([Math.max(200,Math.min(TW-CW,x)),Math.max(20,Math.min(TH-CH,y))]);
    }
    return out;
  }
  function nearDeck(c){
    return Math.abs(c.x+CW/2-(DX+CW/2))<CW*.75&&Math.abs(c.y+CH/2-(DY+CH/2))<CH*.75;
  }
  function returnToDeck(c){
    c.inDeck=true;c.up=false;c.rot=0;c.x=DX;c.y=DY;
    var el=els[c.id];
    delete el.dataset.filled;
    el.firstChild.innerHTML='<div class="face back deckback"></div>';
    var n=0;
    cards.filter(function(o){return o.inDeck&&o!==c}).sort(function(a,b){return a.z-b.z}).forEach(function(o){o.z=++n;paint(o)});
    c.z=++n;
    paint(c);updateDeck();select(null);
  }
  function dealAll(){
    if(dealing)return;
    var list=cards.filter(function(c){return c.inDeck}).sort(function(a,b){return b.z-a.z});
    if(!list.length)return;
    dealing=true;select(null);
    var spots=dealSpots(list.length);
    table.classList.add('dealing');
    list.forEach(function(c,i){
      c.inDeck=false;fill(c);c.rot=0;
      c.x=spots[i][0];c.y=spots[i][1];c.z=++zTop;
      els[c.id].style.transitionDelay=(i*45)+'ms';
      paint(c);
    });
    updateDeck();
    setTimeout(function(){
      table.classList.remove('dealing');
      els.forEach(function(el){el.style.transitionDelay=''});
      dealing=false;save();updateStatus();
    },list.length*45+900);
  }
  function reset(){
    if(dealing)return;
    select(null);lastId=null;allDown=false;bAll.textContent='Turn all face down';
    scrollEl.scrollTo(0,0);
    if(cards.every(function(c){return c.inDeck})){deckLayout();build();save();updateStatus();return}
    dealing=true;
    var order=shuffle(cards.map(function(c){return c.id}),Math.random);
    table.classList.add('dealing');
    order.forEach(function(id,pos){
      var c=cards[id];
      c.inDeck=true;c.up=false;c.rot=0;
      c.x=DX+(51-pos)*.12;c.y=DY+(51-pos)*.12;c.z=pos+1;
      els[id].style.transitionDelay=(pos*18)+'ms';
      paint(c);
    });
    updateDeck();
    setTimeout(function(){dealing=false;zTop=100;build();save();updateStatus()},52*18+900);
  }

  function loadState(){
    try{
      var raw=localStorage.getItem(STORE);
      if(!raw)return false;
      var d=JSON.parse(raw);
      if(!Array.isArray(d.cards)||d.cards.length!==52)return false;
      cards=d.cards.map(function(c,i){var r=Math.floor(i/4),s=i%4;return{id:i,r:r,s:s,q:DES[r].perm.indexOf(s),x:+c.x,y:+c.y,rot:+c.rot,up:!!c.up,z:+c.z||i+1,inDeck:!!c.d}});
      zTop=d.zTop||100;
      return true;
    }catch(e){return false}
  }
  function save(){
    try{localStorage.setItem(STORE,JSON.stringify({zTop:zTop,cards:cards.map(function(c){return{x:c.x,y:c.y,rot:c.rot,up:c.up,z:c.z,d:c.inDeck?1:0}})}))}catch(e){}
  }

  function faces(c){
    var su=SUITS[c.s],rk=RANKS[c.r];
    return '<div class="face front'+(su.red?' red':'')+'">'+
      '<span class="cn tl"><b>'+rk+'</b><i>'+su.s+'</i></span>'+
      '<span class="cn br"><b>'+rk+'</b><i>'+su.s+'</i></span>'+
      '<span class="big">'+CODES[c.r][c.q]+'</span></div>'+
      '<div class="face back">'+backSvg(c)+'</div>';
  }
  function fill(c){
    var el=els[c.id];
    if(el.dataset.filled)return;
    el.dataset.filled='1';
    el.firstChild.innerHTML=faces(c);
  }

  function build(){
    table.innerHTML='';els=[];
    var slot=document.createElement('div');
    slot.className='slot';slot.style.left=DX+'px';slot.style.top=DY+'px';slotEl=slot;
    table.appendChild(slot);
    deckLbl=document.createElement('div');
    deckLbl.className='deckLbl';deckLbl.style.left=DX+'px';deckLbl.style.top=(DY+CH+10)+'px';
    table.appendChild(deckLbl);
    cards.forEach(function(c){
      var el=document.createElement('div');
      el.className='card';
      el.dataset.id=c.id;
      el.innerHTML='<div class="flip"><div class="face back deckback"></div></div>';
      table.appendChild(el);els.push(el);
      if(!c.inDeck)fill(c);
      paint(c);
    });
    updateDeck();
  }

  function paint(c){
    var el=els[c.id];
    el.style.left=c.x+'px';el.style.top=c.y+'px';
    el.style.zIndex=c.z;
    el.style.transform='rotate('+c.rot+'deg)';
    el.classList.toggle('down',!c.up);
    el.classList.toggle('sel',selected===c.id);
    el.setAttribute('aria-label',c.inDeck?'Deck':RANKS[c.r]+' of '+SUITS[c.s].n+', '+(c.up?'face up':'face down'));
  }

  function applyZoom(){
    table.style.width=TW+'px';table.style.height=TH+'px';
    table.style.transform='scale('+scale+')';
    sizer.style.width=(TW*scale)+'px';sizer.style.height=(TH*scale)+'px';
  }

  function eff(c){
    var q=((Math.round(c.rot/90)%2)+2)%2===1;
    var w=q?CH:CW,h=q?CW:CH,cx=c.x+CW/2,cy=c.y+CH/2;
    return{l:cx-w/2,r:cx+w/2,t:cy-h/2,b:cy+h/2};
  }
  function clamp(c){
    var e=eff(c),dx=0,dy=0;
    if(e.l<0)dx=-e.l;else if(e.r>TW)dx=TW-e.r;
    if(e.t<0)dy=-e.t;else if(e.b>TH)dy=TH-e.b;
    c.x+=dx;c.y+=dy;
  }
  function snap(c){
    if(!snapOn)return;
    var e=eff(c),bx=null,by=null;
    cards.forEach(function(o){
      if(o===c||o.inDeck)return;
      var f=eff(o);
      if(e.b>f.t-T&&e.t<f.b+T){
        [f.r-e.l,f.l-e.r,f.l-e.l,f.r-e.r].forEach(function(d){if(Math.abs(d)<T&&(bx===null||Math.abs(d)<Math.abs(bx)))bx=d});
      }
      if(e.r>f.l-T&&e.l<f.r+T){
        [f.b-e.t,f.t-e.b,f.t-e.t,f.b-e.b].forEach(function(d){if(Math.abs(d)<T&&(by===null||Math.abs(d)<Math.abs(by)))by=d});
      }
    });
    if(bx!==null)c.x+=bx;
    if(by!==null)c.y+=by;
  }

  function select(id){
    var prev=selected;selected=id;
    if(prev!==null&&prev!==id)paint(cards[prev]);
    if(id!==null)paint(cards[id]);
    updateStatus();
  }
  function updateStatus(){
    if(selected===null){statusEl.textContent='';return}
    var c=cards[selected];
    statusEl.textContent=RANKS[c.r]+' of '+SUITS[c.s].n+', '+(c.up?'face up':'face down');
  }
  function front(c){c.z=++zTop;paint(c)}
  function flip(c){c.up=!c.up;paint(c);save();updateStatus()}
  function rotate(c,d){c.rot+=d;clamp(c);paint(c);save()}
  function toggleSnap(){
    snapOn=!snapOn;document.getElementById('bSnap').setAttribute('aria-pressed',snapOn?'true':'false');
  }

  var drag=null,pan=null,scrollEl=document.getElementById('scroll');
  function setHover(id){if(selected!==id)select(id);if(id!==null)lastId=id}
  function hover(e){
    var el=e.target.closest?e.target.closest('.card'):null;
    if(!el){if(selected!==null)select(null);else updateStatus();return}
    var c=cards[+el.dataset.id];
    if(c.inDeck){
      if(selected!==null)select(null);
      statusEl.textContent='Deck \u00b7 '+deckCount()+' cards. Click to deal them all, or drag one off.';
      return;
    }
    setHover(c.id);
  }
  table.addEventListener('pointerdown',function(e){
    if(dealing||e.button!==0)return;
    var el=e.target.closest('.card');
    if(!el){
      if(e.pointerType==='mouse'){
        pan={sx:e.clientX,sy:e.clientY,sl:scrollEl.scrollLeft,st:scrollEl.scrollTop,pid:e.pointerId};
        try{table.setPointerCapture(e.pointerId)}catch(err){}
        table.classList.add('panning');
      }
      return;
    }
    var c=cards[+el.dataset.id];
    drag={c:c,el:el,sx:e.clientX,sy:e.clientY,ox:c.x,oy:c.y,moved:false,pid:e.pointerId};
    try{el.setPointerCapture(e.pointerId)}catch(err){}
    if(!c.inDeck){front(c);select(c.id);lastId=c.id}
  });
  table.addEventListener('pointermove',function(e){
    if(pan&&e.pointerId===pan.pid){
      scrollEl.scrollLeft=pan.sl-(e.clientX-pan.sx);
      scrollEl.scrollTop=pan.st-(e.clientY-pan.sy);
      return;
    }
    if(!drag){if(e.pointerType==='mouse')hover(e);return}
    if(e.pointerId!==drag.pid)return;
    var dx=(e.clientX-drag.sx)/scale,dy=(e.clientY-drag.sy)/scale;
    var c=drag.c;
    if(!drag.moved){
      if(Math.abs(dx)+Math.abs(dy)<6/scale)return;
      drag.moved=true;drag.el.classList.add('dragging');
      if(c.inDeck){leaveDeck(c);front(c);select(c.id);lastId=c.id}
    }
    c.x=drag.ox+dx;c.y=drag.oy+dy;
    clamp(c);snap(c);clamp(c);paint(c);
    slotEl.classList.toggle('over',nearDeck(c));
  });
  function end(e){
    if(pan&&e.pointerId===pan.pid){pan=null;table.classList.remove('panning');return}
    if(!drag||e.pointerId!==drag.pid)return;
    var d=drag;drag=null;
    d.el.classList.remove('dragging');
    slotEl.classList.remove('over');
    if(!d.moved&&e.type==='pointerup'){if(d.c.inDeck)dealAll();else flip(d.c)}
    else{if(d.moved&&!d.c.inDeck&&nearDeck(d.c))returnToDeck(d.c);save()}
  }
  table.addEventListener('pointerup',end);
  table.addEventListener('pointercancel',end);
  scrollEl.addEventListener('pointerleave',function(){if(!drag&&!pan&&selected!==null)select(null)});
  table.addEventListener('contextmenu',function(e){
    var el=e.target.closest('.card');
    if(!el)return;
    e.preventDefault();
    var c=cards[+el.dataset.id];
    if(c.inDeck)return;
    select(c.id);lastId=c.id;rotate(c,e.shiftKey?-90:90);
  });

  scrollEl.addEventListener('wheel',function(e){
    e.preventDefault();
    var rect=scrollEl.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
    var tx=(scrollEl.scrollLeft+mx)/scale,ty=(scrollEl.scrollTop+my)/scale;
    var k=e.deltaMode===1?.05:(e.ctrlKey?.01:.0015);
    var ns=Math.min(2,Math.max(.2,scale*Math.exp(-e.deltaY*k)));
    if(ns===scale)return;
    scale=ns;applyZoom();
    scrollEl.scrollLeft=tx*scale-mx;scrollEl.scrollTop=ty*scale-my;
  },{passive:false});

  function target(){var id=selected!==null?selected:lastId;return id===null?null:cards[id]}
  document.addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    var k=e.key.toLowerCase();
    if(k==='escape'){select(null);return}
    if(k==='s'){toggleSnap();return}
    var c=target();
    if(!c||c.inDeck)return;
    if(k==='f'){flip(c)}
    else if(k==='r'){rotate(c,e.shiftKey?-90:90)}
  });

  function need(){var c=target();if(!c){statusEl.textContent='Hover over a card first.';return null}return c}
  document.getElementById('bFlip').onclick=function(){var c=need();if(c)flip(c)};
  document.getElementById('bRotL').onclick=function(){var c=need();if(c)rotate(c,-90)};
  document.getElementById('bRotR').onclick=function(){var c=need();if(c)rotate(c,90)};
  document.getElementById('bSnap').onclick=toggleSnap;
  var bAll=document.getElementById('bAll');
  bAll.onclick=function(){
    allDown=!allDown;
    cards.forEach(function(c){if(!c.inDeck){c.up=!allDown;paint(c)}});
    bAll.textContent=allDown?'Turn all face up':'Turn all face down';
    save();updateStatus();
  };
  document.getElementById('bReset').onclick=reset;

  function start(){
    CODES=decode();
    makeDesigns();
    if(!loadState())deckLayout();
    applyZoom();build();updateStatus();
  }
  var go=false;
  function once(){if(go)return;go=true;start()}
  try{
    Promise.race([
      document.fonts.load('700 200px "'+FONT+'"','0123456789ABCabc'),
      new Promise(function(res){setTimeout(res,1500)})
    ]).then(once,once);
  }catch(e){once()}
})();
</script>
</body>
</html>
